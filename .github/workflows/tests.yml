name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run the tool on the sample data
        run: |
          PYTHONPATH=src python -m ransomware_ready samples/riverbend_components_systems.csv --practices samples/riverbend_components_practices.json --out reports
          PYTHONPATH=src python -m ransomware_ready samples/northfield_cold_logistics_systems.csv --practices samples/northfield_cold_logistics_practices.json --out reports --fail-below 60
